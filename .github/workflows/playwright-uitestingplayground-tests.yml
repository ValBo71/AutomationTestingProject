name: Playwright UI Test Automation Playground

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs at 04:00 UTC (07:00 Bulgarian Summer Time / 06:00 Winter Time) every day.
    # Each suite has its own half-hour slot so no two share a runner
    # window - when a run goes red it is then obvious which suite, and
    # which target, is responsible.
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run UI Test Automation Playground Tests
    runs-on: ubuntu-latest

    # Several challenges stall on purpose - the AJAX and client-delay pages
    # block for about 15 seconds each, and the progress bar runs to a target
    # value - and CI runs them on a single worker. A healthy run is a few
    # minutes; this cap stops a hung run from occupying a runner for the
    # six-hour default.
    timeout-minutes: 20

    defaults:
      run:
        working-directory: "01.Playwright/07-uitestingplayground-ui-typescript"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: "01.Playwright/07-uitestingplayground-ui-typescript/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      # Cheap and fast, so it runs before the browser install: a type error
      # fails the job in seconds instead of after downloading Chromium.
      - name: Type Check
        run: npm run typecheck

      # Only the chromium project is configured in playwright.config.ts, so
      # installing the full browser set would download Firefox and WebKit for
      # nothing.
      - name: Install Playwright Chromium with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-uitestingplayground
          path: "01.Playwright/07-uitestingplayground-ui-typescript/playwright-report/"
          if-no-files-found: ignore

      - name: Upload Playwright Traces & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-uitestingplayground
          path: "01.Playwright/07-uitestingplayground-ui-typescript/test-results/"
          if-no-files-found: ignore
