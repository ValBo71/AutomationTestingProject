name: Playwright the-internet UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs at 03:30 UTC (06:30 Bulgarian Summer Time / 05:30 Winter Time) every day.
    # Each suite has its own half-hour slot so no two share a runner
    # window - when a run goes red it is then obvious which suite, and
    # which target, is responsible.
    - cron: '30 3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run the-internet UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "01.Playwright/06-the-internet-ui-typescript"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: "01.Playwright/06-the-internet-ui-typescript/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      # Cheap and fast, so it runs before the browser install: a type error
      # fails the job in seconds instead of after downloading Chromium.
      - name: Type Check
        run: npm run typecheck

      # Only the chromium project is configured in playwright.config.ts, so
      # installing the full browser set would download Firefox and WebKit for
      # nothing.
      - name: Install Playwright Chromium with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-the-internet
          path: "01.Playwright/06-the-internet-ui-typescript/playwright-report/"
          if-no-files-found: ignore

      - name: Upload Playwright Traces & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-the-internet
          path: "01.Playwright/06-the-internet-ui-typescript/test-results/"
          if-no-files-found: ignore
